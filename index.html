<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>🐚 戴珍珠耳环的少女 · 艺术闯关测试</title>
    <script>
        // 【第一重保险】放在 head 最前面，尽可能早地禁用滚动恢复
        (function() {
            if ('scrollRestoration' in history) {
                history.scrollRestoration = 'manual';
            }
            if (window.location.hash) {
                try {
                    window.location.replace(window.location.pathname + window.location.search);
                } catch(e) {}
            }
            var checkScroll = setInterval(function() {
                if (window.scrollY > 5 || document.documentElement.scrollTop > 5 || document.body.scrollTop > 5) {
                    window.scrollTo(0, 0);
                    document.documentElement.scrollTop = 0;
                    document.body.scrollTop = 0;
                }
            }, 5);
            setTimeout(function() { clearInterval(checkScroll); }, 2000);
        })();
    </script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        /* 【第二重保险】彻底抛弃 flex 布局，改用最普通的块级文档流 */
        body {
            background: linear-gradient(145deg, #1a1e2c 0%, #2b2f45 100%);
            font-family: 'Segoe UI', Roboto, 'Helvetica Neue', system-ui, sans-serif;
            padding: 18px;
        }
        .test-card {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
            background: rgba(250, 247, 235, 0.95);
            backdrop-filter: blur(4px);
            border-radius: 56px 56px 48px 48px;
            padding: 32px 28px 42px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6), 0 4px 12px rgba(0,0,0,0.3);
            border: 1px solid #b8af94;
        }
        h1 {
            font-size: 2.1rem;
            font-weight: 700;
            color: #2d253b;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
            border-bottom: 3px dashed #b8a88a;
            padding-bottom: 18px;
            margin-bottom: 22px;
            letter-spacing: -0.3px;
        }
        h1 small {
            font-size: 1rem;
            font-weight: 400;
            color: #4f4460;
            margin-left: 6px;
        }
        .question-block {
            background: #fcf9f0;
            border-radius: 32px;
            padding: 20px 22px 18px;
            margin-bottom: 22px;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.10);
            border: 1px solid #d6ccb8;
            transition: 0.2s;
            position: relative;
        }
        .question-block.correct {
            border-left: 8px solid #4f9f7a;
            background: #f2fcf6;
        }
        .question-block.wrong {
            border-left: 8px solid #c0695a;
            background: #fdf4f2;
        }
        .q-title {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .q-num {
            background: #5b4f6b;
            color: #f0ede6;
            font-weight: 600;
            font-size: 0.9rem;
            padding: 4px 14px;
            border-radius: 40px;
            letter-spacing: 0.3px;
        }
        .q-type {
            font-size: 0.85rem;
            background: #d3c9b8;
            color: #2f2840;
            padding: 2px 16px;
            border-radius: 30px;
            font-weight: 500;
        }
        .q-text {
            font-size: 1.2rem;
            font-weight: 500;
            color: #1e1a2a;
            margin: 8px 0 14px 0;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin: 6px 0 4px;
        }
        .opt-label {
            display: flex;
            align-items: center;
            gap: 14px;
            background: #f0ebe0;
            padding: 12px 18px;
            border-radius: 60px;
            border: 1px solid #d6cbbc;
            transition: all 0.15s;
            cursor: pointer;
            font-size: 1.05rem;
            color: #1f1b2a;
        }
        .opt-label:hover {
            background: #e5ddd0;
            border-color: #b3a58e;
        }
        .opt-label input[type="checkbox"],
        .opt-label input[type="radio"] {
            width: 20px;
            height: 20px;
            accent-color: #6a5d7a;
            flex-shrink: 0;
            cursor: pointer;
        }
        .opt-label input:disabled + span {
            opacity: 0.9;
        }
        .opt-label.correct-option {
            background: #d0ecdc;
            border-color: #3a8a62;
        }
        .opt-label.wrong-option {
            background: #f8dbd6;
            border-color: #b85a4a;
        }
        .opt-label.missed-option {
            background: #f7e5d4;
            border-color: #c98f7a;
            opacity: 0.9;
        }
        .result-badge {
            display: inline-block;
            margin-left: 14px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .action-bar {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            margin: 28px 0 16px;
            gap: 14px;
        }
        .btn {
            background: #dacfc0;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            color: #242033;
            border: 1px solid #b8ad98;
            box-shadow: 0 4px 0 #9b8f7a;
            transition: 0.08s linear;
            cursor: pointer;
            flex: 1 1 auto;
            min-width: 130px;
            letter-spacing: 0.5px;
            background: #ded3c2;
        }
        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #9b8f7a;
        }
        .btn-primary {
            background: #7b6d8a;
            border-color: #5e516b;
            color: #f5f0e6;
            box-shadow: 0 4px 0 #473d50;
        }
        .btn-primary:active {
            box-shadow: 0 1px 0 #473d50;
        }
        .btn:disabled {
            opacity: 0.5;
            transform: translateY(2px);
            box-shadow: 0 2px 0 #9b8f7a;
            pointer-events: none;
        }
        .score-area {
            background: #2d2640;
            border-radius: 60px;
            padding: 16px 24px;
            color: #efeade;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px 10px;
            margin-top: 18px;
            border: 1px solid #5b4e6b;
        }
        .score-badge {
            display: flex;
            align-items: baseline;
            gap: 12px;
            flex-wrap: wrap;
        }
        .score-number {
            font-size: 2.1rem;
            font-weight: 700;
            background: #443a54;
            padding: 0 18px;
            border-radius: 60px;
            line-height: 1.4;
            color: #f3ede0;
        }
        .rank-box {
            background: #443a54;
            padding: 6px 22px;
            border-radius: 60px;
            font-size: 1.2rem;
            font-weight: 500;
            color: #f4ede0;
            white-space: nowrap;
        }
        .rank-box span {
            font-weight: 700;
            color: #fadf9e;
        }
        .footer-note {
            text-align: center;
            margin-top: 24px;
            font-size: 0.95rem;
            color: #61586e;
            border-top: 1px solid #cdc2b0;
            padding-top: 20px;
            letter-spacing: 0.4px;
        }
        .reset-area {
            display: flex;
            justify-content: flex-end;
        }
        .btn-reset {
            background: #c7bbac;
            color: #232033;
            padding: 8px 22px;
            font-size: 1rem;
            min-width: 80px;
            flex: 0 1 auto;
            box-shadow: 0 3px 0 #9d907e;
        }
        @media (max-width: 520px) {
            .test-card { padding: 22px 16px; }
            h1 { font-size: 1.7rem; }
            .q-text { font-size: 1.05rem; }
            .opt-label { font-size: 0.95rem; padding: 10px 14px; }
            .btn { padding: 12px 16px; font-size: 1rem; }
            .score-number { font-size: 1.8rem; }
        }
    </style>
</head>
<body>
<div class="test-card" id="app">
    <h1>
        🐚 戴珍珠耳环的少女 · 闯关
        <small>🎯 维米尔·荷兰黄金时代</small>
    </h1>

    <div id="questionsContainer"></div>

    <div class="action-bar">
        <button class="btn btn-primary" id="submitBtn">✅ 提交答案</button>
        <div class="reset-area">
            <button class="btn btn-reset" id="resetBtn">🔄 重玩</button>
        </div>
    </div>

    <div class="score-area" id="scoreArea">
        <div class="score-badge">
            <span style="font-size:1.2rem;">🏆 得分</span>
            <span class="score-number" id="scoreDisplay">0</span>
            <span style="font-size:1rem;">/ 16</span>
        </div>
        <div class="rank-box" id="rankDisplay">
            <span>🌟</span> 艺术小种子
        </div>
    </div>
    <div class="footer-note">
        ⭐ 绿色边框=答对，红色边框=答错 · 错题不显示答案，可自己再思考
    </div>
</div>

<script>
    (function() {
        // ---------- 题库：戴珍珠耳环的少女 · 六大维度 ----------
        const QUESTIONS = [
            // 1. 时代背景
            { id: 1, type: 'single', text: '《戴珍珠耳环的少女》创作于哪个国家的黄金时代？', options: ['A. 意大利', 'B. 法国', 'C. 荷兰', 'D. 西班牙'], answer: [2] },
            // 2. 时代背景
            { id: 2, type: 'single', text: '这幅画大约创作于哪一年？', options: ['A. 1645年', 'B. 1665年', 'C. 1685年', 'D. 1705年'], answer: [1] },
            // 3. 时代背景 (多选)
            { id: 3, type: 'multi', text: '关于17世纪荷兰的艺术环境，以下哪些说法正确？', options: ['A. 画家主要靠宫廷赞助', 'B. 市民阶层成为艺术的主要购买者', 'C. 风俗画和肖像画非常繁荣', 'D. 宗教画是唯一允许的题材'], answer: [1,2] },
            // 4. 画家生平
            { id: 4, type: 'single', text: '维米尔一生大约留下了多少幅作品？', options: ['A. 约35幅', 'B. 约200幅', 'C. 约500幅', 'D. 约1000幅'], answer: [0] },
            // 5. 画家生平 (多选)
            { id: 5, type: 'multi', text: '关于维米尔的人生，以下哪些说法正确？', options: ['A. 他生前非常富有', 'B. 他去世时负债累累', 'C. 他去世后被人遗忘了约两百年', 'D. 他是荷兰黄金时代最著名的画家之一'], answer: [1,2] },
            // 6. 画家生平
            { id: 6, type: 'single', text: '维米尔可能使用什么工具辅助作画，以精确捕捉光影？', options: ['A. 望远镜', 'B. 暗箱（Camera Obscura）', 'C. 显微镜', 'D. 投影仪'], answer: [1] },
            // 7. 画面叙事
            { id: 7, type: 'single', text: '画中少女的姿态是？', options: ['A. 正面站立', 'B. 侧身坐着', 'C. 背对观者但回头凝视', 'D. 低头沉思'], answer: [2] },
            // 8. 画面叙事 (多选)
            { id: 8, type: 'multi', text: '关于画中少女的视觉元素，以下哪些描述正确？', options: ['A. 她戴着蓝色头巾', 'B. 她穿着红色长裙', 'C. 她嘴唇微启，仿佛要说话', 'D. 她戴着一颗珍珠耳环'], answer: [0,2,3] },
            // 9. 画面叙事
            { id: 9, type: 'single', text: '画中少女的身份是？', options: ['A. 荷兰女王', 'B. 维米尔的妻子', 'C. 至今没有定论', 'D. 一位意大利公主'], answer: [2] },
            // 10. 形式与技法 (多选)
            { id: 10, type: 'multi', text: '关于《戴珍珠耳环的少女》的技法，以下哪些描述正确？', options: ['A. 使用柔和的光影过渡塑造面部', 'B. 珍珠耳环上只有两笔高光', 'C. 背景是详细的室内场景', 'D. 使用昂贵的群青蓝颜料'], answer: [0,1,3] },
            // 11. 形式与技法
            { id: 11, type: 'single', text: '画中头巾使用的群青蓝颜料，当时的价格如何？', options: ['A. 非常便宜', 'B. 比黄金还贵', 'C. 和普通颜料差不多', 'D. 免费赠送'], answer: [1] },
            // 12. 形式与技法
            { id: 12, type: 'single', text: '画面的光源主要来自哪个方向？', options: ['A. 右下方', 'B. 正上方', 'C. 左上方', 'D. 正后方'], answer: [2] },
            // 13. 美学与心理 (多选)
            { id: 13, type: 'multi', text: '观看《戴珍珠耳环的少女》时，观众常产生哪些心理感受？', options: ['A. 亲密感，仿佛她认识你', 'B. 疏离感，因为她身份不明', 'C. 温柔感，来自柔和的光影', 'D. 恐惧感，因为背景黑暗'], answer: [0,1,2] },
            // 14. 历史影响
            { id: 14, type: 'single', text: '《戴珍珠耳环的少女》现藏于哪个博物馆？', options: ['A. 巴黎卢浮宫', 'B. 伦敦国家美术馆', 'C. 纽约大都会博物馆', 'D. 海牙莫瑞泰斯皇家美术馆'], answer: [3] },
            // 15. 历史影响 (多选)
            { id: 15, type: 'multi', text: '关于这幅画的历史影响，以下哪些说法正确？', options: ['A. 它被称为“北方的蒙娜丽莎”', 'B. 它启发了同名小说和电影', 'C. 它在维米尔生前就非常有名', 'D. 它是莫瑞泰斯皇家美术馆的镇馆之宝'], answer: [0,1,3] },
            // 16. 综合
            { id: 16, type: 'single', text: '《戴珍珠耳环的少女》最核心的艺术魅力在于？', options: ['A. 复杂的叙事故事', 'B. 一个回眸瞬间的永恒化', 'C. 精确的透视法则', 'D. 华丽的装饰细节'], answer: [1] }
        ];

        const TOTAL = QUESTIONS.length;

        function getRank(score) {
            if (score >= 13) return { emoji: '🏆', label: '珍珠小博士' };
            if (score >= 9) return { emoji: '🌟', label: '维米尔小侦探' };
            return { emoji: '🌱', label: '艺术小种子' };
        }

        const container = document.getElementById('questionsContainer');
        const submitBtn = document.getElementById('submitBtn');
        const resetBtn = document.getElementById('resetBtn');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const rankDisplay = document.getElementById('rankDisplay');

        function renderQuestions() {
            let html = '';
            QUESTIONS.forEach((q, idx) => {
                const qId = `q${idx}`;
                const typeLabel = q.type === 'single' ? '⭐ 单选' : '★★ 多选';
                const inputType = q.type === 'single' ? 'radio' : 'checkbox';
                const nameAttr = q.type === 'single' ? `name="${qId}"` : '';

                html += `<div class="question-block" data-qidx="${idx}" id="block-${idx}">`;
                html += `<div class="q-title"><span class="q-num">${idx+1}</span><span class="q-type">${typeLabel}</span>`;
                html += `<span class="result-badge" id="badge-${idx}"></span>`;
                html += `</div>`;
                html += `<div class="q-text">${q.text}</div>`;
                html += `<div class="options" id="options-${idx}">`;

                q.options.forEach((optText, optIdx) => {
                    const val = String(optIdx);
                    html += `<label class="opt-label" id="optlabel-${idx}-${optIdx}">`;
                    html += `<input type="${inputType}" ${nameAttr} value="${val}" data-q="${idx}" data-opt="${optIdx}">`;
                    html += `<span>${optText}</span>`;
                    html += `</label>`;
                });

                html += `</div></div>`;
            });
            container.innerHTML = html;
        }

        function getUserSelections() {
            const allInputs = container.querySelectorAll('input[type="radio"], input[type="checkbox"]');
            const selections = {};
            allInputs.forEach(input => {
                const qIdx = parseInt(input.dataset.q, 10);
                if (!selections[qIdx]) selections[qIdx] = [];
                if (input.checked) {
                    selections[qIdx].push(parseInt(input.dataset.opt, 10));
                }
            });
            return selections;
        }

        function getDetailedResult(selections) {
            const result = { score: 0, details: [] };
            for (let i = 0; i < QUESTIONS.length; i++) {
                const q = QUESTIONS[i];
                const userAns = selections[i] || [];
                const correctAns = q.answer.slice().sort();
                const sortedUser = userAns.slice().sort();
                const isCorrect = JSON.stringify(sortedUser) === JSON.stringify(correctAns);
                if (isCorrect) result.score++;
                result.details.push({
                    correct: isCorrect,
                    userAns: userAns.slice(),
                    correctAns: correctAns
                });
            }
            return result;
        }

        function applyResultDetails(details) {
            for (let i = 0; i < details.length; i++) {
                const block = document.getElementById(`block-${i}`);
                const badge = document.getElementById(`badge-${i}`);
                const detail = details[i];
                block.classList.remove('correct', 'wrong');
                if (detail.correct) {
                    block.classList.add('correct');
                    badge.innerHTML = '✅ <span style="color:#1f7a4a;">答对啦</span>';
                } else {
                    block.classList.add('wrong');
                    badge.innerHTML = '❌ <span style="color:#b14535;">再想想</span>';
                }

                const q = QUESTIONS[i];
                const userAns = detail.userAns;
                const correctAns = detail.correctAns;

                for (let optIdx = 0; optIdx < q.options.length; optIdx++) {
                    const label = document.getElementById(`optlabel-${i}-${optIdx}`);
                    if (!label) continue;
                    label.classList.remove('correct-option', 'wrong-option', 'missed-option');
                    const isUserSelected = userAns.includes(optIdx);
                    if (isUserSelected) {
                        if (correctAns.includes(optIdx)) {
                            label.classList.add('correct-option');
                        } else {
                            label.classList.add('wrong-option');
                        }
                    } else {
                        if (correctAns.includes(optIdx)) {
                            label.classList.add('missed-option');
                        }
                    }
                }
            }
        }

        function updateScore(score) {
            scoreDisplay.textContent = score;
            const rank = getRank(score);
            rankDisplay.innerHTML = `<span>${rank.emoji}</span> ${rank.label}`;
        }

        function disableAllInputs(disabled = true) {
            const inputs = container.querySelectorAll('input');
            inputs.forEach(inp => inp.disabled = disabled);
        }

        function handleSubmit() {
            const selections = getUserSelections();
            let allAnswered = true;
            for (let i = 0; i < QUESTIONS.length; i++) {
                if (!selections[i] || selections[i].length === 0) {
                    allAnswered = false;
                    break;
                }
            }
            if (!allAnswered) {
                alert('🧐 还有题目没有作答呢！每道题至少选一个选项再提交吧～');
                return;
            }

            const result = getDetailedResult(selections);
            updateScore(result.score);
            applyResultDetails(result.details);
            disableAllInputs(true);
            submitBtn.disabled = true;
            document.getElementById('scoreArea').scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function handleReset() {
            const inputs = container.querySelectorAll('input');
            inputs.forEach(inp => {
                inp.checked = false;
                inp.disabled = false;
            });
            const blocks = container.querySelectorAll('.question-block');
            blocks.forEach(block => {
                block.classList.remove('correct', 'wrong');
            });
            const badges = container.querySelectorAll('.result-badge');
            badges.forEach(b => b.innerHTML = '');
            const optLabels = container.querySelectorAll('.opt-label');
            optLabels.forEach(label => {
                label.classList.remove('correct-option', 'wrong-option', 'missed-option');
            });
            submitBtn.disabled = false;
            updateScore(0);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function init() {
            renderQuestions();
            updateScore(0);
            submitBtn.addEventListener('click', handleSubmit);
            resetBtn.addEventListener('click', handleReset);
        }

        init();
    })();
</script>
</body>
</html>
